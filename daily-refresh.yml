name: Daily IPO data refresh
on:
  schedule:
    - cron: '30 3 * * 1-5' # 09:00 IST, weekdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current dataset
        run: python scripts/refresh_data.py
      # TODO: After confirming permitted access and implementing verified adapters,
      # fetch Groww IPO subscriptions and Screener prices here. Fail closed on parse errors.
      - name: Commit changed data if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ipos.json data.js
          git diff --cached --quiet || (git commit -m 'chore: refresh IPO data' && git push)
