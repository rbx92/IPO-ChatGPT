name: Groww API coverage test (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-data-writers
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade growwapi pyotp pandas
      - name: Test Groww API login, coverage, prices and candles
        env:
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: python scripts/test_groww_api.py
      - name: Commit report
        if: always()
        run: |
          [ -f reports/groww-api-test.json ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/groww-api-test.json
          git diff --cached --quiet || { git commit -m "chore: Groww API coverage test report"; git pull --rebase origin main; git push; }
