name: Alert on IPO scraper failure

on:
  workflow_run:
    workflows: ["Refresh Groww IPO feed"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp failure alert
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_TARGET_NUMBER: ${{ secrets.WA_TARGET_NUMBER }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
          FAILED_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          phone_id = os.environ.get("WA_PHONE_NUMBER_ID", "").strip()
          token = os.environ.get("WA_ACCESS_TOKEN", "").strip()
          target = os.environ.get("WA_TARGET_NUMBER", "").strip()

          if not all((phone_id, token, target)):
              print("ERROR: WhatsApp alert secrets are missing. Configure WA_PHONE_NUMBER_ID, WA_ACCESS_TOKEN, and WA_TARGET_NUMBER.")
              sys.exit(1)

          run_url = os.environ["FAILED_RUN_URL"]
          run_name = os.environ.get("FAILED_RUN_NAME", "IPO scraper")
          sha = os.environ.get("FAILED_RUN_SHA", "")[:7]
          message = (
              "IPO LENS ALERT: Groww subscription refresh failed. "
              "The dashboard may be showing older figures. "
              "The last successful feed is preserved; check the workflow logs and repair the scraper. "
              f"Workflow: {run_name}. Commit: {sha}. Logs: {run_url}"
          )
          payload = {
              "messaging_product": "whatsapp",
              "to": target,
              "type": "text",
              "text": {"preview_url": False, "body": message},
          }
          request = urllib.request.Request(
              f"https://graph.facebook.com/v21.0/{phone_id}/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = response.read().decode("utf-8")
                  print(f"WhatsApp API accepted failure alert: HTTP {response.status}")
                  print(result)
          except urllib.error.HTTPError as exc:
              print(f"WhatsApp API returned HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')}")
              sys.exit(1)
          except Exception as exc:
              print(f"Could not send WhatsApp failure alert: {exc}")
              sys.exit(1)
          PY
