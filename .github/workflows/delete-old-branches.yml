name: Delete old branches (one-off)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          for b in chore/add-40-screener-mappings-remove-4-ipos feature/open-ipo-rainbow-qib fix-review-items fix/cmp-preserve-records fix/shared-ipo-eligibility-rules fix/shared-ipo-rules-import ipo-lifecycle-screener redesign remove-yahoo-prices scrape-screener screener-price-updater-validation; do
            git push origin --delete "$b" && echo "deleted $b" || echo "could not delete $b"
          done
