name: Screener mapping validation (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screener-mapping-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate new Screener mappings without changing data
        run: python scripts/validate_screener_map.py --delay 60
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-mapping-validation
          path: |
            screener-mapping-validation.csv
            screener-mapping-validation.json
          if-no-files-found: warn
