name: Refresh Groww IPO feed

on:
  workflow_dispatch:
  schedule:
    # Normal hourly refresh (UTC minute 17).
    - cron: "17 * * * *"
    # IPO closing-day checks: every 15 minutes from 9:00 AM to 3:45 PM IST.
    - cron: "30,45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
    # Final hour of an IPO closing day: every 5 minutes from 4:00 PM to 4:55 PM IST.
    - cron: "30,35,40,45,50,55 10 * * 1-5"
    - cron: "0,5,10,15,20,25 11 * * 1-5"
  push:
    paths:
      - "scrape_groww_ipo.py"
      - ".github/workflows/refresh-groww-ipo.yml"

permissions:
  contents: write

concurrency:
  group: ipo-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install --upgrade requests pandas lxml
      - name: Scrape open and upcoming IPOs from Groww
        run: python scrape_groww_ipo.py
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- live-ipo-data.json; then
            echo "Groww feed unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live-ipo-data.json
            git commit -m "Refresh Groww IPO feed"
            git pull --rebase origin main
            git push
          fi
