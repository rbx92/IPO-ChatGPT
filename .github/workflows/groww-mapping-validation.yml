name: Groww Mainboard and SME mapping validation (read-only)
on:
  push:
    paths:
      - "scripts/update_groww_prices.py"
      - "scripts/validate_groww_map.py"
      - "scripts/test_update_groww_prices.py"
      - ".github/workflows/groww-mapping-validation.yml"
      - "ipos.json"
      - "groww_map.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: groww-mapping-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate Groww instrument mapping across Mainboard and SME IPOs
        run: python scripts/validate_groww_map.py
      - name: Upload Groww mapping report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groww-mapping-validation
          path: |
            groww-mapping-validation.csv
            groww-mapping-validation.json
          if-no-files-found: warn
