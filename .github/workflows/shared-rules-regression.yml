name: Shared IPO rules regression tests

on:
  push:
    branches:
      - main
      - fix/shared-ipo-rules-import
    paths:
      - "scripts/rules.py"
      - "scripts/update_prices.py"
      - "scripts/update_ipo_lifecycle.py"
      - "scrape_groww_ipo.py"
      - "tests/test_shared_rules_regression.py"
      - ".github/workflows/shared-rules-regression.yml"
      - ".github/workflows/daily-price-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper test dependencies
        run: python -m pip install requests pandas lxml
      - name: Compile changed Python scripts
        run: python -m py_compile scripts/rules.py scripts/update_prices.py scripts/update_ipo_lifecycle.py scrape_groww_ipo.py tests/test_shared_rules_regression.py
      - name: Run disposable import and listing-transition regression tests
        run: python -m unittest discover -s tests -p 'test_shared_rules_regression.py' -v
