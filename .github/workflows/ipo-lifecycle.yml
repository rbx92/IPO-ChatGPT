name: IPO lifecycle transition
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ipo-lifecycle.yml"
  schedule:
    - cron: "37 11 * * 1-5" # 17:07 IST, weekdays
permissions:
  contents: write
concurrency:
  group: ipo-data-writers
  cancel-in-progress: false
jobs:
  transition:
    # Paused pending written permission from Screener.in for automated access and public data use.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transition closed IPOs using Screener history
        run: python scripts/update_ipo_lifecycle.py
      - name: Commit lifecycle data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-ipo-data.json ipos.json data.js
          if git diff --cached --quiet; then
            echo "No lifecycle changes."
          else
            git commit -m "chore: advance IPO lifecycle from Screener data"
            if ! git pull --rebase origin main; then
              echo "Concurrent feed update detected; recomputing lifecycle against latest main."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              python scripts/update_ipo_lifecycle.py
              git add live-ipo-data.json ipos.json data.js
              if git diff --cached --quiet; then
                echo "No lifecycle changes after refresh."
                exit 0
              fi
              git commit -m "chore: advance IPO lifecycle from latest feed"
            fi
            git push
          fi
