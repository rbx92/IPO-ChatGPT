name: Update IPO historical prices

on:
  schedule:
    # 13:30 UTC = 19:00 IST, after the Indian market close.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_price_history.py"
      - ".github/workflows/update-price-history.yml"

permissions:
  contents: write

concurrency:
  group: ipo-price-history
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill and update recent IPO closing prices
        run: python scripts/update_price_history.py
      - name: Commit updated history
        run: |
          if git diff --quiet -- ipos.json data.js; then
            echo "No price-history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipos.json data.js
          git commit -m "Update historical IPO closing prices"
          git push
