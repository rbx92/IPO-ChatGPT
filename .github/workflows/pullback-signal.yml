name: Post-listing pullback signal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_pullbacks.py"
      - ".github/workflows/pullback-signal.yml"
  schedule:
    - cron: "37 16 * * 1-5" # 22:07 IST, weekdays, after CMP and lifecycle jobs

permissions:
  contents: write

concurrency:
  group: ipo-data-writers
  cancel-in-progress: false

jobs:
  pullbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch daily closes for pullback candidates (60s between requests)
        run: python scripts/update_pullbacks.py --delay 60
      - name: Commit price history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipos.json data.js screener_map.json screener_chart_ids.json
          if git diff --cached --quiet; then
            echo "No pullback history changes."
          else
            git commit -m "chore: refresh post-listing price history from Screener"
            git pull --rebase origin main
            git push
          fi
