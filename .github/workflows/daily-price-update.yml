name: Daily IPO CMP update (Screener batches)
on:
  schedule:
    - cron: "45 10 * * 1-5" # 16:15 IST, weekdays
  workflow_dispatch:
    inputs:
      start:
        description: "Zero-based offset among eligible IPOs"
        required: true
        default: "0"
        type: string
      limit:
        description: "Number of eligible IPOs to update; 0 means all remaining"
        required: true
        default: "0"
        type: string
permissions:
  contents: write
concurrency:
  group: ipo-data-writers
  cancel-in-progress: false
jobs:
  update-cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      START: ${{ inputs.start || '0' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - name: Checkout dashboard data
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Update eligible IPO CMP from Screener in batches of 9
        run: python scripts/update_prices.py --start "$START" --limit "$LIMIT" --batch-size 9 --delay 60
      - name: Commit completed Screener CMP updates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipos.json data.js screener_map.json
          if git diff --cached --quiet; then
            echo "No changed files to commit."
          else
            git commit -m "chore: refresh IPO CMP data from Screener"
            git pull --rebase origin main
            git push
          fi
