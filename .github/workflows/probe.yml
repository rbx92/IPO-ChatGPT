name: Probe (temporary)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python scripts/probe.py
      - run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/probe.json && git commit -qm "chore: probe output" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
