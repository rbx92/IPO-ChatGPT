name: Daily data update (listings, prices, pullbacks)

# One job, run in order, so no step can be cancelled while queued behind another:
#   1. Listings from Groww (one request)
#   2. Mainboard prices and closes from Yahoo (a few seconds)
#   3. SME prices from Screener (60 s between requests)
#   4. SME closes for the pullback signal from Screener (60 s between requests)
# Each stage commits on its own, so a later failure never loses earlier work.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * 1-5" # 16:15 IST weekdays (GitHub often starts scheduled jobs late)

permissions:
  contents: write

concurrency:
  group: ipo-data-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > /tmp/commit.sh <<'SH'
          set -e
          git add -A ipos.json data.js live-ipo-data.json screener_map.json screener_chart_ids.json yahoo_symbols.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "$1"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
          SH
      - name: 1. Listings from Groww
        run: python scripts/update_lifecycle_groww.py
      - run: bash /tmp/commit.sh "chore: advance IPO listings from Groww"
      - name: 2. Mainboard prices from Yahoo
        if: always()
        run: python scripts/update_prices_yahoo.py
      - if: always()
        run: bash /tmp/commit.sh "chore: refresh mainboard CMP from Yahoo"
      - name: 3. SME prices from Screener
        if: always()
        run: python scripts/update_prices.py --stock-type SME --batch-size 9 --delay 60
      - if: always()
        run: bash /tmp/commit.sh "chore: refresh SME CMP from Screener"
      - name: 4. SME pullback closes from Screener
        if: always()
        run: python scripts/update_pullbacks.py --stock-type SME --delay 60
      - if: always()
        run: bash /tmp/commit.sh "chore: refresh SME price history from Screener"
