name: Backtest pullback rule (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python scripts/backtest_pullback.py
      - name: Save results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/backtest 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: pullback backtest results"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; git rebase --abort || true; sleep 5; done
