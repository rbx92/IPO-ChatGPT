name: Verify prices against official exchange closes (manual)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Trading day YYYY-MM-DD (blank = latest available)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python scripts/verify_prices.py ${{ inputs.day }}
      - name: Save report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/price-check.json reports/price-check.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: price check against official closes"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; git rebase --abort || true; sleep 5; done
